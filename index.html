<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WashPair</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7f5; color: #192d2a; font: 1rem/1.55 sans-serif; }
    main { width: min(100% - 2rem, 42rem); margin: 3rem auto; }
    h1 { font-size: 3rem; line-height: 1; margin-block: 0 .6rem; }
    h2 { font-size: 1.15rem; }
    form, section { background: white; border: 1px solid #c6d5cf; border-radius: .75rem; padding: 1.2rem; margin-top: 1rem; }
    label { display: block; margin-bottom: .75rem; }
    textarea { display: block; width: 100%; margin-top: .25rem; padding: .6rem; border: 1px solid #6b8178; border-radius: .25rem; font: inherit; }
    button { padding: .65rem 1rem; background: #164f43; color: white; border: 0; border-radius: .25rem; font: inherit; }
    button:disabled { opacity: .55; }
    li { margin-block: .4rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>WashPair</h1>
    <p>Compare the instructions on two English care labels.</p>
    <form id="check-labels">
      <label>First label <textarea id="first" required maxlength="500" rows="3">Machine wash gentle at 30°C. Line dry.</textarea></label>
      <label>Second label <textarea id="second" required maxlength="500" rows="3">Machine wash at 40°C. Do not bleach.</textarea></label>
      <label><input type="checkbox" id="cloud"> Allow cloud fallback for these label texts</label>
      <button>Compare labels</button>
    </form>
    <section id="result" aria-live="polite" hidden></section>
  </main>
  <script type="module" src="/main-next.mjs"></script>
</body>
</html>
